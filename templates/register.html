<!DOCTYPE html>
<html>
<head>
    <title>X.ai Register</title>
</head>
<body>

<h2>🤖 Create X.ai Account</h2>

<form method="POST">

    <input
        type="text"
        name="username"
        placeholder="Username"
        required
    >

    <br><br>

    <input
        type="password"
        name="password"
        placeholder="Password"
        required
    >

    <br><br>

    <button type="submit">Create Account</button>

</form>

<p>
    Already have an account?
    <a href="/login">Login</a>
</p>

{% if error %}
<p style="color:red;">{{ error }}</p>
{% endif %}

</body>
</html>
