
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>X.ai</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .app {
            width: 95%;
            max-width: 900px;
            height: 90vh;
            background: white;
            border-radius: 20px;
            box-shadow: 0 5px 30px rgba(0, 0, 0, 0.15);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .header {
            height: 85px;
            display: flex;
            align-items: center;
            padding: 15px 25px;
            border-bottom: 1px solid #ddd;
        }

        .logo {
            width: 52px;
            height: 52px;
            border-radius: 50%;
            object-fit: contain;
            margin-right: 14px;
        }

        .title {
            font-size: 28px;
            font-weight: bold;
        }

        .online {
            margin-left: auto;
            color: #555;
            font-size: 16px;
        }

        .logout {
            margin-left: 20px;
            padding: 9px 16px;
            border: none;
            border-radius: 18px;
            background: #111;
            color: white;
            cursor: pointer;
            font-size: 14px;
        }

        .logout:hover {
            background: #333;
        }

        #chat {
            flex: 1;
            padding: 25px;
            overflow-y: auto;
        }

        .message {
            max-width: 75%;
            padding: 14px 18px;
            margin-bottom: 15px;
            border-radius: 16px;
            font-size: 16px;
            line-height: 1.5;
            word-wrap: break-word;
        }

        .ai {
            background: #eeeeee;
            color: #111;
            margin-right: auto;
        }

        .user {
            background: #111;
            color: white;
            margin-left: auto;
        }

        .input-area {
            display: flex;
            gap: 12px;
            padding: 18px;
            border-top: 1px solid #ddd;
        }

        #message {
            flex: 1;
            height: 52px;
            padding: 0 20px;
            border: 1px solid #ccc;
            border-radius: 28px;
            outline: none;
            font-size: 16px;
        }

        #message:focus {
            border-color: #777;
        }

        #send {
            height: 52px;
            padding: 0 28px;
            border: none;
            border-radius: 28px;
            background: #111;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        #send:hover {
            background: #333;
        }

        #send:disabled {
            background: #888;
            cursor: not-allowed;
        }

        @media (max-width: 600px) {
            .app {
                width: 100%;
                height: 100vh;
                border-radius: 0;
            }

            .header {
                padding: 12px 15px;
            }

            .logo {
                width: 45px;
                height: 45px;
            }

            .title {
                font-size: 24px;
            }

            .online {
                display: none;
            }

            .message {
                max-width: 85%;
            }

            .input-area {
                padding: 12px;
            }

            #send {
                padding: 0 20px;
            }
        }
    </style>
</head>

<body>

    <div class="app">

        <div class="header">

            <img
                src="{{ url_for('static', filename='logo.png') }}"
                alt="X.ai Logo"
                class="logo"
            >

            <div class="title">
                X.ai
            </div>

            <div class="online">
                ● Online
            </div>

            <button
                class="logout"
                onclick="window.location.href='/logout'">
                Logout
            </button>

        </div>

        <div id="chat">

            <div class="message ai">
                Hello! I'm X.ai. How can I help you? 🤖
            </div>

        </div>

        <div class="input-area">

            <input
                type="text"
                id="message"
                placeholder="Message X.ai..."
                autocomplete="off"
            >

            <button id="send">
                Send
            </button>

        </div>

    </div>

    <script>

        const messageInput =
            document.getElementById("message");

        const sendButton =
            document.getElementById("send");

        const chat =
            document.getElementById("chat");


        function addMessage(text, type) {

            const message =
                document.createElement("div");

            message.className =
                "message " + type;

            message.textContent = text;

            chat.appendChild(message);

            chat.scrollTop =
                chat.scrollHeight;
        }


        async function sendMessage() {

            const text =
                messageInput.value.trim();

            if (!text) {
                return;
            }

            addMessage(text, "user");

            messageInput.value = "";

            sendButton.disabled = true;

            addMessage("Thinking...", "ai");

            try {

                const response =
                    await fetch("/chat", {
                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body: JSON.stringify({
                            message: text
                        })
                    });


                const data =
                    await response.json();


                const aiMessages =
                    document.querySelectorAll(".ai");


                if (aiMessages.length > 0) {

                    aiMessages[
                        aiMessages.length - 1
                    ].remove();

                }


                addMessage(
                    data.response ||
                    "No response received.",
                    "ai"
                );

            } catch (error) {

                const aiMessages =
                    document.querySelectorAll(".ai");

                if (aiMessages.length > 0) {

                    aiMessages[
                        aiMessages.length - 1
                    ].remove();

                }

                addMessage(
                    "Connection error. Please make sure Ollama is running.",
                    "ai"
                );

            } finally {

                sendButton.disabled = false;

                messageInput.focus();
            }
        }


        sendButton.addEventListener(
            "click",
            sendMessage
        );


        messageInput.addEventListener(
            "keydown",
            function(event) {

                if (event.key === "Enter") {
                    sendMessage();
                }

            }
        );

    </script>

</body>

</html>
